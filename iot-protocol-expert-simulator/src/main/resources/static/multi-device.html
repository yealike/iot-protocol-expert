<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>多设备模拟实验室</title>
<style>body{font:15px system-ui;background:#0a1421;color:#e8f0f8;max-width:960px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#152637;border:1px solid #294258;padding:18px;border-radius:12px}button{background:#0d876c;color:white;border:0;border-radius:7px;padding:10px;margin:4px;cursor:pointer}pre{white-space:pre-wrap;color:#a5d8ca}.hint{color:#aac0d0}input{padding:9px;background:#102333;color:white;border:1px solid #36506a;border-radius:5px}</style>
<h1>多设备模拟实验室</h1><p class="hint">光伏、风机、储能和电表使用模拟 Modbus；地锁、道闸和摄像机使用模拟 MQTT。请先配置并启动多设备模拟与协议采集。</p><div class="grid" id="devices"></div><p><input type="password" id="token" placeholder="模拟控制令牌"><button onclick="scenario('fault')">切换故障 / 正常</button><button onclick="scenario('pause')">暂停 / 恢复上报</button></p><p class="hint">模拟控制仅作用于 SIM- 设备，正式设备不使用本协议。</p><pre id="status"></pre><p><a href="/" style="color:#9ee5c8">返回充电实验室</a></p>
<script>const labels={pv:'光伏逆变器',wind:'风机',storage:'储能柜',meter:'电表',lock:'地锁',gate:'道闸',camera:'摄像机'};async function refresh(){try{const r=await fetch('/api/multi/state');const d=await r.json();document.getElementById('devices').innerHTML=Object.entries(labels).map(([k,v])=>'<div class="card">'+v+'<pre>'+JSON.stringify(d[k],null,2)+'</pre></div>').join('');document.getElementById('status').textContent='模拟：'+(d.enabled?(d.running?'运行':'已暂停'):'未启用')+' · 故障：'+(d.fault?'已注入':'正常')+' · MQTT：'+(d.mqttConnected?'已连接':'未连接')}catch(e){document.getElementById('status').textContent='模拟器不可用'}}async function scenario(action){const r=await fetch('/api/multi/scenario',{method:'POST',headers:{'Content-Type':'application/json','X-Simulation-Token':document.getElementById('token').value},body:JSON.stringify({action})});if(!r.ok)alert('操作失败，请检查令牌和模拟开关');refresh()}setInterval(refresh,2000);refresh()</script></html>
