server:
  port: ${PEP_MODEL_GATEWAY_PORT:19085}
  shutdown: graceful

spring:
  config:
    import: classpath:observability-defaults.yml
  main:
    banner-mode: "off"
  application:
    name: iot-protocol-expert-model-gateway
  datasource:
    url: ${PEP_METERING_DB_URL:${IPE_OPS_DB_URL:jdbc:postgresql://127.0.0.1:55432/ipe_ops}}
    username: ${PEP_METERING_DB_USER:${IPE_OPS_DB_USER:ipe}}
    password: ${PEP_METERING_DB_PASSWORD:${IPE_OPS_DB_PASSWORD:}}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 5000
      connection-init-sql: SET search_path TO pep_metering
  flyway:
    enabled: true
    baseline-on-migrate: false
    default-schema: pep_metering
    schemas: pep_metering
    create-schemas: true
    locations: classpath:db/migration
    placeholder-replacement: false
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  mvc:
    problemdetails:
      enabled: true
    async:
      request-timeout: 600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"
    call-setters-on-nulls: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

pep:
  gateway:
    # 控制服务调用网关管理/查询接口的共享令牌；与 Runtime 的运行凭据分开
    service-token: ${PEP_MODEL_GATEWAY_SERVICE_TOKEN:}
    # 控制服务签发运行凭据的 HMAC 密钥；必须与 iot-protocol-expert-agent-control 的 IPE_INTERNAL_SERVICE_KEY 对齐
    run-token-secret: ${IPE_INTERNAL_SERVICE_KEY:}
    # 供应商密钥加密主密钥；只从本机环境变量或挂载文件读取
    credential-master-key: ${PEP_CREDENTIAL_MASTER_KEY:${IPE_CREDENTIAL_MASTER_KEY:}}
    credential-master-key-file: ${PEP_CREDENTIAL_MASTER_KEY_FILE:${IPE_CREDENTIAL_MASTER_KEY_FILE:}}
    public-base-url: ${PEP_MODEL_GATEWAY_BASE_URL:http://127.0.0.1:19085}
    connect-timeout-ms: ${PEP_MODEL_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${PEP_MODEL_READ_TIMEOUT_MS:300000}
    dispatch-deadline-seconds: ${PEP_MODEL_DISPATCH_DEADLINE_SECONDS:15}
    reservation-ttl-seconds: ${PEP_MODEL_RESERVATION_TTL_SECONDS:900}
    counting:
      # 保守估算：字符数 / chars-per-token + 固定开销；不是精确 tokenizer
      chars-per-token: ${PEP_MODEL_CHARS_PER_TOKEN:0.5}
      message-overhead: ${PEP_MODEL_MESSAGE_OVERHEAD:8}
      request-overhead: ${PEP_MODEL_REQUEST_OVERHEAD:256}
      strict: ${PEP_MODEL_STRICT_COUNTING:false}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service.name: ${spring.application.name}
        service.version: 1.0.0
        deployment.environment.name: ${ipe.observability.environment}
      rename:
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  level:
    root: INFO
    top.yealike.pep.modelgateway: INFO
    org.springframework: WARN
    com.zaxxer.hikari: WARN
