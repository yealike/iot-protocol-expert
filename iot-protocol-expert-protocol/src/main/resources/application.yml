server:
  port: 19080
  shutdown: graceful

spring:
  config:
    import: classpath:observability-defaults.yml
  main:
    banner-mode: "off"
  application:
    name: iot-protocol-expert-protocol
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,telemetry

ipe:
  protocol:
    ykc-enabled: true
    tcp-port: 8768
    ocpp-enabled: true
    ocpp-port: 8769
    ocpp-path: /ocpp
    ocpp-default-connector-count: 2
    ocpp-idle-timeout-seconds: 300
    boss-threads: 1
    worker-threads: 8
    crypto-key-hex: "${IPE_CRYPTO_KEY_HEX:0123456789ABCDEFFEDCBA9876543210}"
    encryption-enabled: false
    heartbeat-timeout-seconds: 45
    pending-timeout-seconds: 10
    ops-base-url: ${IPE_OPS_BASE_URL:http://127.0.0.1:19082}
    ops-service-token: ${IPE_OPS_SERVICE_TOKEN:local-service-token}
    ops-timeout-ms: ${IPE_OPS_TIMEOUT_MS:5000}

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service.name: ${spring.application.name}
        service.version: 1.0.0
        deployment.environment.name: ${ipe.observability.environment}
      rename:
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  level:
    root: INFO
    top.yealike.ipe.protocol: INFO
    org.springframework: WARN
    org.springframework.boot: WARN
    org.springframework.boot.autoconfigure: WARN
    org.springframework.web: WARN
    org.springframework.http: WARN
    io.netty: WARN
