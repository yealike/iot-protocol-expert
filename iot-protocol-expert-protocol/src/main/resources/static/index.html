<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云快充 1.6 协议平台 · iot-protocol-expert</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
    <div class="brand">
        <span class="dot"></span>
        <div>
            <h1>云快充 1.6 协议平台</h1>
            <p>iot-protocol-expert-protocol · TCP 8768 · HTTP 19080</p>
        </div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
</header>

<main>
    <section class="cards">
        <article class="card"><span>接入设备</span><strong id="deviceCount">0</strong></article>
        <article class="card"><span>在线设备</span><strong id="onlineCount">0</strong></article>
        <article class="card"><span>进行中订单</span><strong id="runningOrders">0</strong></article>
        <article class="card"><span>上下行帧</span><strong id="frameCount">0 / 0</strong></article>
    </section>

    <section class="panel">
        <div class="panel-head"><h2>充电桩</h2><button class="ghost" onclick="refresh()">刷新</button></div>
        <div class="table-wrap">
            <table>
                <thead><tr>
                    <th>桩编号</th><th>状态</th><th>枪</th><th>协议</th><th>程序版本</th><th>最后心跳</th><th>操作</th>
                </tr></thead>
                <tbody id="devices"><tr><td colspan="7" class="empty">暂无设备，启动模拟器后自动建档</td></tr></tbody>
            </table>
        </div>
    </section>

    <div class="two-col">
        <section class="panel">
            <div class="panel-head"><h2>订单</h2></div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>流水号</th><th>枪</th><th>状态</th><th>电量</th><th>金额</th></tr></thead>
                    <tbody id="orders"><tr><td colspan="5" class="empty">暂无订单</td></tr></tbody>
                </table>
            </div>
        </section>

        <section class="panel">
            <div class="panel-head"><h2>交易记录</h2></div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>流水号</th><th>枪</th><th>电量</th><th>金额</th><th>停止原因</th></tr></thead>
                    <tbody id="transactions"><tr><td colspan="5" class="empty">暂无交易</td></tr></tbody>
                </table>
            </div>
        </section>
    </div>

    <section class="panel">
        <div class="panel-head">
            <h2>帧流水</h2>
            <div class="filters">
                <input id="pileFilter" placeholder="按桩号过滤" onkeydown="if(event.key==='Enter')refresh()">
                <button class="ghost" onclick="refresh()">查询</button>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>时间</th><th>方向</th><th>桩</th><th>帧</th><th>摘要</th><th>报文体</th></tr></thead>
                <tbody id="frames"><tr><td colspan="6" class="empty">暂无数据</td></tr></tbody>
            </table>
        </div>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
