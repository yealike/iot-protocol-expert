upstream ipe_ops { server ipe-ops:19082; }
upstream ipe_control { server ipe-control:19083; }

server {
    listen 80;
    client_max_body_size 25m;
    root /usr/share/nginx/html;

    location ^~ /api/ai/ {
        proxy_pass http://ipe_control;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_buffering off;
        proxy_read_timeout 35m;
    }

    location ^~ /api/control/ {
        proxy_pass http://ipe_control;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location ~ ^/(api/|login$|logout$|actuator/) {
        proxy_pass http://ipe_ops;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /simulator {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
