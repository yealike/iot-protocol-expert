apiVersion: 1
datasources:
  - name: IPE Jaeger
    uid: ipe-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      nodeGraph: {enabled: true}
      tracesToLogsV2:
        datasourceUid: ipe-loki
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
        tags: [{key: service.name, value: service_name}]
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{$${__tags}} | trace_id="$${__span.traceId}"'
  - name: IPE Loki
    uid: ipe-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: ipe-jaeger
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
  - name: IPE Prometheus
    uid: ipe-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: ipe-jaeger
