name: ipe-observability
services:
  jaeger:
    # Grafana's built-in Jaeger datasource needs the legacy search API removed in 2.21.
    image: quay.io/jaegertracing/jaeger:2.20.0
    command: ["--config=/etc/jaeger/config.yaml"]
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${IPE_BIND_ADDRESS:-127.0.0.1}:16686:16686"
    volumes:
      - ./jaeger.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/var/lib/jaeger
    mem_limit: 1536m
    logging: &logging
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
    networks: [monitoring]
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/config.yaml"]
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 1024m
    logging: *logging
    networks: [monitoring]
  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped
    user: "0:0"
    ports:
      - "${IPE_BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "${IPE_BIND_ADDRESS:-127.0.0.1}:4318:4318"
      - "127.0.0.1:13133:13133"
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
      - collector-data:/var/lib/otelcol
    mem_limit: 768m
    depends_on: [jaeger, loki]
    logging: *logging
    networks: [monitoring]
volumes:
  jaeger-data:
  loki-data:
  collector-data:
networks:
  monitoring:
    external: true
    name: ${IPE_MONITORING_NETWORK:-prometheus-grafana_monitoring}
